[project]
name = "commentcensor"
version = "0.2.0"
description = "Every comment is an error until you write down why it cannot be avoided"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "pyyaml>=6.0",
]

[project.scripts]
commentcensor = "commentcensor.cli:main"

[project.urls]
Source = "https://github.com/botforge-pro/commentcensor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commentcensor"]
force-include = { "MANIFESTO.md" = "commentcensor/MANIFESTO.md" }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
