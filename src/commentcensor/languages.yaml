licence_markers:
  - SPDX-License-Identifier
  - Copyright
  - Licensed under

marker_characters: "/-#*<!"

section_markers:
  - "MARK:"
  - "MARK -"
  - "region"
  - "endregion"

languages:
  python:
    grammar: python
    extensions: [".py", ".pyi"]
    docstrings: true
    directives:
      - "noqa"
      - "type: ignore"
      - "type: ("
      - "pragma:"
      - "pylint:"
      - "ruff:"
      - "mypy:"
      - "flake8:"
      - "coverage:"
      - "fmt:"
      - "isort:"
      - "yapf:"
      - "pyright:"
      - "nosec"

  go:
    grammar: go
    extensions: [".go"]
    directives:
      - "go:"
      - "+build"
      - "nolint"
      - "noinspection"

  sql:
    grammar: sql
    extensions: [".sql"]
    directives:
      - "noqa"
      - "name:"
      - "sqlfluff"

  swift:
    grammar: swift
    extensions: [".swift"]
    directives:
      - "swift-tools-version:"
      - "swiftlint:"
      - "swift-format-ignore"
      - "sourcery:"
      - "periphery:"
      - "swiftformat:"

  kotlin:
    grammar: kotlin
    extensions: [".kt", ".kts"]
    directives:
      - "noinspection"
      - "ktlint-"
      - "detekt:"
      - "Suppress("

  typescript:
    grammar: typescript
    extensions: [".ts", ".mts", ".cts"]
    directives: &script_directives
      - "@ts-"
      - "eslint-disable"
      - "eslint-enable"
      - "eslint-env"
      - "tslint:"
      - "prettier-ignore"
      - "istanbul ignore"
      - "c8 ignore"
      - "v8 ignore"
      - "biome-ignore"
      - "<reference"
      - "@jsx"
      - "webpackChunkName:"
      - "webpackMode:"
      - "webpackPrefetch:"
      - "webpackPreload:"
      - "webpackFetchPriority:"
      - "webpackInclude:"
      - "webpackExclude:"
      - "webpackExports:"
      - "webpackIgnore:"
      - "@vite-ignore"
      - "__PURE__"
      - "@__PURE__"
      - "@__NO_SIDE_EFFECTS__"
      - "sourceMappingURL="
      - "sourceURL="

  tsx:
    grammar: tsx
    extensions: [".tsx"]
    directives: *script_directives

  javascript:
    grammar: javascript
    extensions: [".js", ".jsx", ".mjs", ".cjs"]
    directives: *script_directives
